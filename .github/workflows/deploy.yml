name: Deploy to production
on:
  workflow_run:
    workflows: ["Test"]
    branches:
      - release
    types:
      - completed
env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: p5-gke-cluster
  GKE_ZONE: us-east4
  DEPLOYMENT_NAME: web-editor-node
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/p5.js-web-editor
jobs:
  e2e:
    name: E2E (Cypress)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start app
        env:
          NODE_ENV: development
          PORT: 8000
          PREVIEW_PORT: 8002
          MONGO_URL: mongodb://localhost:27017/p5editor_e2e
          SESSION_SECRET: e2e-ci-session-secret
        run: |
          npm run start &
          echo "Waiting for app on http://localhost:8000 ..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 | grep -q 200; then
              echo "App is up."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "App failed to start in time."
              exit 1
            fi
            sleep 2
          done

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:8000
        run: npm run test:e2e

  push_to_registry:
    environment: production
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: [e2e]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
        with:
          ref: release
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          platforms: linux/amd64,linux/arm64
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          target: production
      # Setup gcloud CLI
      - uses: google-github-actions/setup-gcloud@v0.2.0
        with:
          service_account_key: ${{ secrets.GKE_SA_KEY }}
          project_id: ${{ secrets.GKE_PROJECT }}
 
      # Configure docker to use the gcloud command-line tool as a credential helper
      - run: |-
          gcloud --quiet auth configure-docker
        
      # Get the GKE credentials so we can deploy to the cluster
      - uses: google-github-actions/get-gke-credentials@v0.2.1
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          credentials: ${{ secrets.GKE_SA_KEY }}

      # Deploy the Docker image to the GKE cluster
      - name: Deploy
        run: |-
          kubectl set image deployment/$DEPLOYMENT_NAME web-editor-app=index.docker.io/$IMAGE:$GITHUB_SHA --namespace=production
          kubectl get services -o wide

